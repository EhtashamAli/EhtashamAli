<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ehtasham Ali</title>
  <desc id="desc">Software engineer building production AI, SaaS, and cloud systems</desc>

  <defs>
    <linearGradient id="surface" x1="44" y1="20" x2="1156" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0F14"/>
      <stop offset="1" stop-color="#111923"/>
    </linearGradient>
    <linearGradient id="signal" x1="92" y1="0" x2="348" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8BFFB5"/>
      <stop offset="1" stop-color="#5CE1E6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="280" rx="24" fill="url(#surface)"/>
  <rect width="1200" height="280" rx="24" fill="url(#grid)"/>
  <circle cx="1080" cy="48" r="122" fill="#5CE1E6" fill-opacity="0.08" filter="url(#glow)"/>

  <rect x="76" y="59" width="48" height="4" rx="2" fill="url(#signal)"/>
  <circle cx="1114" cy="64" r="5" fill="#8BFFB5"/>
  <path d="M1062 64H1096" stroke="#8BFFB5" stroke-opacity="0.45" stroke-width="2"/>

  <text x="76" y="144" fill="#F5F7FA" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="58" font-weight="650" letter-spacing="-2">Ehtasham Ali</text>
  <text x="79" y="190" fill="#AAB6C5" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="450" letter-spacing="1.2">SOFTWARE ENGINEER · AI SYSTEMS · SAAS · CLOUD</text>

  <rect x="76" y="228" width="260" height="2" rx="1" fill="url(#signal)"/>
  <text x="1118" y="235" text-anchor="end" fill="#6F7D8D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">BUILD / SHIP / SCALE</text>
